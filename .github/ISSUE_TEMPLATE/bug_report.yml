name: "🐛 Bug Report"
description: "File a bug report or error encountered in OrbitMails"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in OrbitMails! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: "OrbitMails Version / Commit"
      placeholder: "e.g. v0.5.4 or main branch"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: "Deployment Environment"
      options:
        - "Cloudflare Workers (Edge)"
        - "Docker / Docker Compose"
        - "Standalone Node.js"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When I configure Resend and trigger a failover..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce this behavior?"
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs or Error Output"
      description: "Paste terminal output or browser console logs here."
      render: shell

