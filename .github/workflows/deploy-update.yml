name: Zero-Downtime Deploy & Database Migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy Target (production)"
        required: true
        default: "production"

jobs:
  deploy:
    name: Apply Migrations & Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Multi-Dialect Migrations
        run: npm run db:bundle

      - name: Apply Zero-Downtime Database Migrations (Pre-Deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote

      - name: Build Application & Worker
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run deploy:worker

